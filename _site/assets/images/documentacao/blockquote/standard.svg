<svg xmlns="http://www.w3.org/2000/svg" width="560" height="315" viewBox="0 0 560 315" role="img" aria-labelledby="title">
  <title id="title">Blockquote standard com fundo pautado e barra lateral</title>
  <style>
    :root{color-scheme:light dark}.frame{fill:#f8fafc;stroke:#334155}.panel{fill:#f4f8fa;stroke:#c8d0d5}.accent{fill:#2f7d95}.rule{stroke:rgba(47,125,149,.26);stroke-width:1}.text{stroke:#475569;stroke-width:6;stroke-linecap:round}.label{fill:#0f172a;font:600 15px system-ui,sans-serif}.note{fill:#475569;font:12px system-ui,sans-serif}.swatch{stroke:#64748b}@media(prefers-color-scheme:dark){.frame{fill:#0f172a;stroke:#cbd5e1}.panel{fill:#2b303b;stroke:#666}.accent{fill:#2b92db}.rule{stroke:rgba(43,146,219,.32)}.text{stroke:#cbd5e1}.label{fill:#f8fafc}.note{fill:#cbd5e1}}
  </style>
  <rect class="frame" x="20" y="20" width="520" height="250" rx="8"/>
  <rect class="panel" x="50" y="62" width="460" height="150" rx="5"/>
  <path class="rule" d="M50 92h460M50 122h460M50 152h460M50 182h460"/>
  <rect class="accent" x="50" y="62" width="9" height="150"/>
  <path class="text" d="M82 97h330M82 127h375M82 157h285M82 187h205"/>
  <rect class="accent swatch" x="455" y="232" width="24" height="16" rx="2"/>
  <rect class="panel swatch" x="486" y="232" width="24" height="16" rx="2"/>
  <text class="label" x="20" y="297">standard</text>
  <text class="note" x="100" y="297">blockquote nativo · accent + fundo de citação</text>
</svg>
