<section class="jcem-read-aloud" data-jcem-read-aloud aria-label="Leitura em voz alta">
  <div class="jcem-read-aloud__controls">
    <button type="button" data-jcem-read-action="play" aria-label="Ler artigo" title="Ler artigo"><i class="fas fa-play" aria-hidden="true"></i></button>
    <button type="button" data-jcem-read-action="pause" aria-label="Pausar leitura" title="Pausar leitura" aria-pressed="false" disabled><i class="fas fa-pause" data-jcem-read-pause-icon aria-hidden="true"></i></button>
    <button type="button" data-jcem-read-action="stop" aria-label="Parar leitura" title="Parar leitura" disabled><i class="fas fa-stop" aria-hidden="true"></i></button>
    <label class="jcem-read-aloud__mode">
      <i class="fas fa-book-open" aria-hidden="true"></i>
      <select data-jcem-read-reference-mode aria-label="Modo de referências: contínuo" title="Modo de referências: contínuo">
        <option value="continuous" selected>Contínuo</option>
        <option value="summary">Resumido</option>
        <option value="full">Completo</option>
      </select>
    </label>
  </div>
  <p class="visually-hidden" data-jcem-read-status role="status" aria-live="polite">Leitura pronta.</p>
</section>
<script src="{{ '/assets/jcem/js/read-aloud.js' | relative_url }}" defer data-jcem-read-aloud-runtime></script>
