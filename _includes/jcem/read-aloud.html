<section class="jcem-read-aloud" data-jcem-read-aloud aria-label="Leitura em voz alta">
  <p class="jcem-read-aloud__label">Ouvir este artigo</p>
  <div class="jcem-read-aloud__controls">
    <button type="button" data-jcem-read-action="play">Ler</button>
    <button type="button" data-jcem-read-action="pause" disabled>Pausar</button>
    <button type="button" data-jcem-read-action="stop" disabled>Parar</button>
  </div>
  <p class="visually-hidden" data-jcem-read-status role="status" aria-live="polite">Leitura pronta.</p>
</section>
<script src="{{ '/assets/jcem/js/read-aloud.js' | relative_url }}" defer data-jcem-read-aloud-runtime></script>
