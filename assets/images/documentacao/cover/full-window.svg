<svg xmlns="http://www.w3.org/2000/svg" width="560" height="315" viewBox="0 0 560 315" role="img" aria-labelledby="title">
  <title id="title">Cover full-window preenchendo a janela atrás da masthead</title>
  <style>
    :root{color-scheme:light dark}.frame{fill:#f8fafc;stroke:#334155}.chrome{fill:#e2e8f0}.mast{fill:#155e75}.article{fill:#fff;stroke:#64748b;stroke-dasharray:5 4}.media-a{fill:#8a2f4f}.media-b{fill:#245f8f}.sun{fill:#f0c15a}.line{stroke:#64748b;stroke-width:5;stroke-linecap:round}.guide{fill:none;stroke:#f8fafc;stroke-width:2;stroke-dasharray:6 5}.label{fill:#0f172a;font:600 15px system-ui,sans-serif}.note{fill:#475569;font:12px system-ui,sans-serif}@media(prefers-color-scheme:dark){.frame{fill:#0f172a;stroke:#cbd5e1}.chrome{fill:#334155}.article{fill:#111827;stroke:#94a3b8}.label{fill:#f8fafc}.note{fill:#cbd5e1}.line{stroke:#94a3b8}}
  </style>
  <rect class="frame" x="20" y="20" width="520" height="250" rx="8"/>
  <rect class="media-a" x="20" y="20" width="260" height="250" rx="8"/>
  <rect class="media-b" x="280" y="20" width="260" height="250" rx="8"/>
  <circle class="sun" cx="280" cy="145" r="52"/>
  <rect class="mast" x="20" y="34" width="520" height="28" opacity=".82"/>
  <rect class="guide" x="125" y="72" width="310" height="163"/>
  <text class="label" x="20" y="297">full-window</text>
  <text class="note" x="125" y="297">100svh externo; ambos os eixos contidos</text>
</svg>
